apply plugin: "com.android.library"

android {
    namespace "com.xbox.httpclient"
    testNamespace "com.xbox.httpclient.test"
    compileSdk 37
    ndkVersion "27.2.12479018"
    buildFeatures { buildConfig true }

    defaultConfig {
        targetSdk 34
        minSdk 21

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                if (project.hasProperty("HC_NOWEBSOCKETS")) {
                    arguments << "-DHC_NOWEBSOCKETS=1"
                }
                if (project.hasProperty("BUILD_SHARED_LIBS")) {
                    arguments << "-DBUILD_SHARED_LIBS=1"
                    arguments << "-DANDROID_STL=c++_shared"
                }

                // Support 16KB page sizes on 64-bit devices
                // https://developer.android.com/guide/practices/page-sizes#compile-16-kb-alignment
                arguments << "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"

                // externalNativeBuild normally skips static
                // lib targets. This forces it to build.
                targets "libHttpClient.Android"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            // Keep the native tool version reproducible across local and CI builds.
            version "3.18.1"
            buildStagingDirectory "${project.buildDir.getParentFile().getAbsolutePath()}/.cxx/${project.name}"
        }
    }

    compileOptions {
        sourceCompatibility=JavaVersion.VERSION_1_8
        targetCompatibility=JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
        }
    }
}

dependencies {
    // OkHttp 5 enables TCP Happy Eyeballs by default, including when HTTP retries are disabled.
    implementation "com.squareup.okhttp3:okhttp:5.5.1"

    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test:rules:1.5.0"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "junit:junit:4.13.2"
    androidTestImplementation "com.squareup.okhttp3:mockwebserver:5.5.1"
}
