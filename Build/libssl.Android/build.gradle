apply plugin: "com.android.library"

android {
    namespace "com.dummy.libssl"
    compileSdk 37
    ndkVersion "27.2.12479018"
    buildFeatures { buildConfig true }

    defaultConfig {
        targetSdk 34
        minSdk 21

        externalNativeBuild {
            cmake {
                // externalNativeBuild normally skips static
                // lib targets. This forces it to build.
                targets "libssl.Android"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            // Keep the native tool version reproducible across local and CI builds.
            version "3.18.1"
            buildStagingDirectory "${project.buildDir.getParentFile().getAbsolutePath()}/.cxx/${project.name}"
        }
    }
}
