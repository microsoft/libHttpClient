apply plugin: "com.android.library"

android {
    compileSdkVersion 31
    ndkVersion "27.2.12479018"

    defaultConfig {
        targetSdkVersion 34
        minSdkVersion 21

        externalNativeBuild {
            cmake {
                // externalNativeBuild normally skips static
                // lib targets. This forces it to build.
                targets "libssl.Android"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            // AGP 4.1's default CMake 3.10.2 can't configure with NDK r27; 3.18.1 is the newest version AGP 4.1 supports.
            version "3.18.1"
            buildStagingDirectory "${project.buildDir.getParentFile().getAbsolutePath()}/.cxx/${project.name}"
        }
    }
}
