parameters:
  - name: platform
    type: string
  - name: configuration
    type: string

steps:
  - template: checkout.yml

  - task: NuGetToolInstaller@1
    displayName: 'Use NuGet 5.8'
    inputs:
      versionSpec: 5.8

  - task: NuGetAuthenticate@1
    displayName: 'NuGet authenticate'

  # Install the GDK package explicitly into $(Pipeline.Workspace)/gdk
  - script: |
      nuget install Microsoft.GDK.Windows -Version %GDKNugetVersion% -OutputDirectory "%GameDK%" -DirectDownload
      echo "GDK installed to %GameDK%"
      echo "GameDKCoreLatest=%GameDKCoreLatest%"
    displayName: 'Install GDK.Windows via NuGet'

  # Install NuGet dependencies. The GUID below is the NuGetCommand for MSFT internal.
  - task: 333b11bd-d341-40d9-afcf-b32d5ce6f23b@2
    displayName: NuGet restore
    inputs:
      restoreSolution: '*.sln'
    continueOnError: true

  - task: UseDotNet@2
    displayName: 'Use .NET Core sdk'
    inputs:
      packageType: sdk
      version: 3.1.411
      installationPath: $(Agent.ToolsDirectory)/dotnet

  - task: VSBuild@1
    displayName: Build ${{ parameters.platform }}+${{ parameters.configuration }} Solution
    inputs:
      solution: libHttpClient.vs2022.sln
      vsVersion: 17.0
      msbuildArchitecture: x64
      platform: ${{ parameters.platform }}
      configuration: ${{ parameters.configuration }}
      createLogFile: true
      logProjectEvents: true
      logFileVerbosity: 'diagnostic'

  # Run the unit tests (TE / VS CppUnitTest flavor; TAEF isn't installed on hosted agents and runs the
  # same test sources). The solution already builds the test DLL in every leg; x64 hosted agents can
  # run x64 and x86 binaries but not ARM64, so ARM64 stays build-only. The tests need no network.
  # Code coverage (report only, no gate) is collected on the x64 Debug leg and published to the
  # pipeline's Code Coverage tab; other legs use the default settings.
  - powershell: |
      $settings = if ('$(Platform)' -eq 'x64' -and '$(Configuration)' -eq 'Debug') { 'coverage.runsettings' } else { 'default.runsettings' }
      Write-Host "Unit test settings: $settings"
      Write-Host "##vso[task.setvariable variable=HCUnitTestRunSettings]$(Build.SourcesDirectory)\Tests\UnitTests\$settings"
    displayName: Select unit test settings
    condition: and(succeeded(), in(variables['Platform'], 'x64', 'x86'))

  - task: VSTest@2
    displayName: Run unit tests (${{ parameters.platform }} ${{ parameters.configuration }})
    condition: and(succeeded(), in(variables['Platform'], 'x64', 'x86'))
    timeoutInMinutes: 20
    inputs:
      testSelector: testAssemblies
      searchFolder: $(Build.SourcesDirectory)
      testAssemblyVer2: |
        Out\*\${{ parameters.configuration }}\libHttpClient.UnitTest.TE\libHttpClient.UnitTest.TE.dll
      otherConsoleOptions: /Platform:${{ parameters.platform }}
      platform: ${{ parameters.platform }}
      configuration: ${{ parameters.configuration }}
      testRunTitle: libHttpClient unit tests ${{ parameters.platform }} ${{ parameters.configuration }}
      runInParallel: false
      failOnMinTestsNotRun: true
      minimumExpectedTests: 100
      runSettingsFile: $(HCUnitTestRunSettings)

  - task: PublishCodeCoverageResults@2
    displayName: Publish unit test code coverage (report only)
    condition: and(succeededOrFailed(), eq(variables['Platform'], 'x64'), eq(variables['Configuration'], 'Debug'))
    inputs:
      summaryFileLocation: $(Agent.TempDirectory)/**/*.cobertura.xml
      failIfCoverageEmpty: false

  # Regression guard for the WinHTTP provider lock being held across WinHttpSendRequest, which
  # stalls WinHttpProvider::Suspend() on GDK and can miss the PLM Quiesce deadline. The solution
  # builds this project for x64 only (its WinHttpSendRequest interposer relies on undecorated
  # import naming), so it is run only in the x64 legs. It needs no network: it connects to the
  # loopback discard port and measures lock hold time.
  - task: PowerShell@2
    displayName: Run WinHttpProviderLockStallRepro
    condition: and(succeeded(), eq(variables['Platform'], 'x64'))
    inputs:
      targetType: inline
      script: |
        $exe = Join-Path '$(Build.SourcesDirectory)' 'Out\x64\${{ parameters.configuration }}\WinHttpProviderLockStallRepro\WinHttpProviderLockStallRepro.exe'
        if (-not (Test-Path $exe))
        {
            Write-Host "##vso[task.logissue type=error]Regression guard was not built; expected it at $exe"
            exit 1
        }

        & $exe
        $code = $LASTEXITCODE
        Write-Host "WinHttpProviderLockStallRepro exit code: $code"

        switch ($code)
        {
            0 { Write-Host 'PASSED: WinHttpProvider::m_lock was released before the WinHTTP call.' }
            1 { Write-Host '##vso[task.logissue type=error]REPRO: WinHttpProvider::m_lock is being held across WinHttpSendRequest again. On GDK this blocks WinHttpProvider::Suspend() before it reaches its bounded CloseAllConnections drain. See Tests/StandaloneTests/WinHttpProviderLockStallRepro.cpp.' }
            default { Write-Host "##vso[task.logissue type=error]FAILED: the regression guard could not run (exit $code); the result is inconclusive." }
        }

        exit $code

  # End-to-end tests: the Win32 (WinHTTP) flavor against a Python 3 stdlib-only loopback server
  # (Tests/E2E/server/lhc_test_server.py) that the test exe starts itself on 127.0.0.1, so no
  # internet access is needed. The solution builds the E2E project for x64 only. The exe's exit
  # code is the number of failed tests. The server makes its HTTPS certificate at startup with the
  # openssl CLI (PATH or Git for Windows, both present on hosted agents). See Tests/E2E/README.md.
  - task: UsePythonVersion@0
    displayName: Use Python 3 for the E2E test server
    condition: and(succeeded(), eq(variables['Platform'], 'x64'))
    inputs:
      versionSpec: '3.x'
      addToPath: true

  - task: PowerShell@2
    displayName: Run E2E tests (Win32 WinHTTP, ${{ parameters.configuration }})
    condition: and(succeeded(), eq(variables['Platform'], 'x64'))
    timeoutInMinutes: 15
    inputs:
      targetType: inline
      script: |
        $exe = Join-Path '$(Build.SourcesDirectory)' 'Out\x64\${{ parameters.configuration }}\libHttpClient.E2E.Win32\libHttpClient.E2E.Win32.exe'
        if (-not (Test-Path $exe))
        {
            Write-Host "##vso[task.logissue type=error]E2E tests were not built; expected them at $exe"
            exit 1
        }

        python --version
        # Fail (not skip) the HTTPS tests if the server can't make its certificate, so that coverage can't vanish quietly.
        $env:LHC_E2E_REQUIRE_HTTPS = '1'
        & $exe
        $code = $LASTEXITCODE
        if ($code -ne 0)
        {
            Write-Host "##vso[task.logissue type=error]libHttpClient E2E tests failed (exit code $code). See the summary at the end of the log."
        }
        exit $code
