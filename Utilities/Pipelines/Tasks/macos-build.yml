parameters:
  - name: configuration
    type: string

steps:
  - template: checkout.yml

  # Restore External/ before xcodebuild starts. The Xcode targets also restore in a build phase, but
  # Xcode plans the build (and records missing source files) before any script phase runs, so on a
  # fresh agent the External/zlib sources compiled by libHttpClient_* would be reported missing.
  - task: Bash@3
    displayName: 'Restore third-party sources (vcpkg)'
    inputs:
      filePath: './Build/vcpkg/restore-vcpkg.sh'

  - task: Xcode@5
    displayName: 'Clean build macOS static lib'
    inputs:
      actions: 'clean build'
      configuration: ${{ parameters.configuration }}
      sdk: 'macosx'
      xcWorkspacePath: Build/libHttpClient.Apple.C/libHttpClient.xcworkspace
      scheme: 'libHttpClient_macOS'
      packageApp: false
      useXcpretty: false

  - task: Xcode@5
    displayName: 'Clean build macOS framework'
    inputs:
      actions: 'clean build'
      configuration: ${{ parameters.configuration }}
      sdk: 'macosx'
      xcWorkspacePath: Build/libHttpClient.Apple.C/libHttpClient.xcworkspace
      scheme: 'libHttpClientFramework_macOS'
      packageApp: false
      useXcpretty: false

  - task: Xcode@5
    displayName: 'Clean build macOS_NOWEBSOCKETS static lib'
    inputs:
      actions: 'clean build'
      configuration: ${{ parameters.configuration }}
      sdk: 'macosx'
      xcWorkspacePath: Build/libHttpClient.Apple.C/libHttpClient.xcworkspace
      scheme: 'libHttpClient_NOWEBSOCKETS_macOS'
      packageApp: false
      useXcpretty: false

  - task: Xcode@5
    displayName: 'Clean build macOS_NOWEBSOCKETS framework'
    inputs:
      actions: 'clean build'
      configuration: ${{ parameters.configuration }}
      sdk: 'macosx'
      xcWorkspacePath: Build/libHttpClient.Apple.C/libHttpClient.xcworkspace
      scheme: 'libHttpClientFramework_NOWEBSOCKETS_macOS'
      packageApp: false
      useXcpretty: false

  # Unit tests (plan 3.2). The Xcode projects above have no ctest integration, so a small host CMake
  # project (Build/libHttpClient.UnitTest.CMake) builds just the portable unit-test executable -- the
  # same Tests/UnitTests sources the Windows and Linux legs run, against the Generic platform -- and
  # ctest runs everything labelled "unit".
  - task: Bash@3
    displayName: 'Build and run unit tests (host CMake, ctest -L unit)'
    inputs:
      targetType: 'inline'
      script: |
        set -e
        BUILD_DIR="$(Build.SourcesDirectory)/Int/CMake/libHttpClient.UnitTest.macOS.${{ parameters.configuration }}"
        cmake -S "$(Build.SourcesDirectory)/Build/libHttpClient.UnitTest.CMake" -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=${{ parameters.configuration }}
        cmake --build "$BUILD_DIR" --parallel "$(sysctl -n hw.ncpu)"
        cd "$BUILD_DIR"
        ctest --output-on-failure -L unit

  # End-to-end tests (plan 2.6): the Tests/E2E suite against a host-CMake build of the library with the
  # real Apple providers (NSURLSession HTTP + websocketpp/OpenSSL WebSockets, see HC_BUILD_E2E_TESTS in
  # Build/libHttpClient.UnitTest.CMake) and the Python 3 loopback server the test exe starts itself.
  # EXPERIMENTAL: this CMake target has never been built outside CI (no local macOS), so the step is
  # continueOnError until it has run green; then drop continueOnError so E2E failures fail the leg.
  # OpenSSL comes from Homebrew (openssl@3 is preinstalled on the hosted macOS images).
  - task: Bash@3
    displayName: 'Build and run E2E tests (host CMake, ctest -L e2e) [experimental]'
    continueOnError: true
    inputs:
      targetType: 'inline'
      script: |
        set -e
        BUILD_DIR="$(Build.SourcesDirectory)/Int/CMake/libHttpClient.E2E.macOS.${{ parameters.configuration }}"
        cmake -S "$(Build.SourcesDirectory)/Build/libHttpClient.UnitTest.CMake" -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=${{ parameters.configuration }} -DHC_BUILD_E2E_TESTS=ON -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
        cmake --build "$BUILD_DIR" --parallel "$(sysctl -n hw.ncpu)" --target libHttpClient.E2E
        cd "$BUILD_DIR"
        ctest --output-on-failure -L e2e